<div id="guest-piece-style-modal" class="modal-content" role="dialog">
    <button class="modal-close-button" aria-label="Close">×</button>
    <h2>Choose piece style</h2>
    <p>
        You are now connected as <b id="guest-piece-style-user"></b>.
        Your session is valid until <span id="guest-piece-style-expiration">loading...</span>.
    </p>
    <button type="button" class="guest-piece-style-option" data-piece-style="TRADITIONAL">
        <span>Traditional (default)</span>
        <span class="guest-piece-style-images">
            <img src="/images/pieces/traditional/black_general.png" alt="General">
            <img src="/images/pieces/traditional/black_elephant.png" alt="Elephant">
            <img src="/images/pieces/traditional/black_horse.png" alt="Horse">
        </span>
    </button>
    <button type="button" class="guest-piece-style-option" data-piece-style="ROMANIZED_ROUNDED">
        <span>Romanized</span>
        <span class="guest-piece-style-images">
            <img src="/images/pieces/romanized_rounded/black_general.png" alt="General">
            <img src="/images/pieces/romanized_rounded/black_elephant.png" alt="Elephant">
            <img src="/images/pieces/romanized_rounded/black_horse.png" alt="Horse">
        </span>
    </button>
</div>
