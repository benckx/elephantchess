<html lang="en">
<head>
    {{header_init}}
    <title>Server error</title>
    {{meta_no_index}}
    <script defer src="/js/default-base-page.js"></script>
</head>
<body>
{{body_init}}
<div class="main-container-text-error-message">
    <div class="center-content-div">
        <img alt="500 Internal Server Error" class="warning-icon" src="/images/icons/warning.png">
    </div>
    <span class="big-fat-error-message">
        Something went wrong on our side
    </span>
    <div class="center-content-div">
        <div style="width: 94%">
            <p>
                <i>
                    The error has been logged. Please try again later, or <a href="/contact">contact us</a> if the
                    problem persists.
                </i>
            </p>
        </div>
    </div>
</div>
{{footer}}
</body>
</html>
