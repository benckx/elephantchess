name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt in to Node.js 24 for JavaScript-based actions
  # (silences the Node.js 20 deprecation warning until all actions ship Node 24 builds).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check Kotlin formatting (ktlint)
        run: ./gradlew ktlintCheck --no-daemon --continue

      - name: Run JavaScript parser tests
        run: node --test
        working-directory: webapp/src/test/js

      - name: Verify Docker is available (for Testcontainers)
        run: docker version

      - name: Clean build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'Test results'
          detailed_summary: true
          include_passed: true
          flaky_summary: true
          require_tests: false
          annotate_notice: false
          updateComment: true
          job_summary: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xiangqi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Load dev dataset into Postgres
        env:
          PGPASSWORD: postgres
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            pg_restore --no-privileges --no-owner \
            -U postgres -d xiangqi -1 < dev_dataset.pgsql

      - name: Build webapp jar
        run: ./gradlew :webapp:jar --no-daemon --stacktrace -x test

      - name: Install e2e dependencies
        run: npm ci
        working-directory: webapp/src/test/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: webapp/src/test/e2e

      - name: Start webapp
        run: |
          java -jar webapp/build/libs/webapp.jar > /tmp/webapp.log 2>&1 &
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080)" = "200" ]; then
              echo "webapp is up"; exit 0
            fi
            sleep 1
          done
          echo "webapp did not start in time"; cat /tmp/webapp.log; exit 1

      - name: Run Playwright e2e tests
        run: npm test
        working-directory: webapp/src/test/e2e

      - name: Print webapp log on failure
        if: failure()
        run: cat /tmp/webapp.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: webapp/src/test/e2e/playwright-report/**
          if-no-files-found: ignore

      # Publish the HTML report to GitHub Pages so it can be viewed in the
      # browser (just click the link) instead of downloading the artifact zip.
      # Requires Pages to be enabled for the repo (Settings -> Pages -> "GitHub
      # Actions"). Skipped for pull requests from forks, which cannot deploy.
      - name: Upload Pages artifact
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/src/test/e2e/playwright-report

  deploy-e2e-report:
    needs: e2e
    if: always() && needs.e2e.result != 'skipped' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
